<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail | Sally</title>
  <style>
    :root {
      --bg:      #030310;
      --bg-2:    #0a0a20;
      --bg-card: #0d0d28;
      --cyan:    #00f5ff;
      --magenta: #ff0099;
      --purple:  #bd00ff;
      --orange:  #ff6600;
      --green:   #39ff14;
      --text:    #ffffff;
      --text-2:  #8888aa;
      --border:  rgba(0,245,255,.18);
      --font-display: Arial, sans-serif;
      --font-mono:    Arial, monospace;
      --font-body:    Arial, sans-serif;
      --glow-cyan:    0 0 8px rgba(0,245,255,.5), 0 0 20px rgba(0,245,255,.25);
      --glow-magenta: 0 0 8px rgba(255,0,153,.5), 0 0 20px rgba(255,0,153,.25);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.65;
      opacity: 0;
      transition: opacity .5s;
    }
    a { text-decoration: none; color: inherit; }

    ::-webkit-scrollbar       { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 2px; }

    /* ── Background ── */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.03) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header / nav ── */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 18px 60px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(3,3,16,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-2);
      cursor: pointer;
      transition: all .25s;
    }
    .back-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow-cyan); }

    .nav-brand {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: var(--glow-cyan);
    }

    /* ── Main layout ── */
    .detail-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 40px 80px;
      position: relative;
      z-index: 1;
    }

    /* ── Hero block ── */
    .detail-hero {
      margin-bottom: 52px;
    }

    .detail-category {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: .22em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 18px;
    }

    .detail-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .detail-title .accent { color: var(--cyan); text-shadow: var(--glow-cyan); }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-2);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
    }

    .meta-chip .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    /* ── Sections ── */
    .detail-section {
      margin-bottom: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 30px;
      position: relative;
      overflow: hidden;
    }

    .detail-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(to bottom, var(--cyan), var(--purple));
      border-radius: 3px 0 0 3px;
    }

    .ds-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--magenta);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .ds-heading {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .ds-body {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.8;
    }

    .ds-body strong { color: var(--text); font-weight: 600; }

    /* ── Tech stack ── */
    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 4px;
    }

    .tech-pill {
      padding: 5px 14px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      border: 1px solid;
    }

    .tech-cyan    { color: var(--cyan);    background: rgba(0,245,255,.08);  border-color: rgba(0,245,255,.25); }
    .tech-magenta { color: var(--magenta); background: rgba(255,0,153,.08);  border-color: rgba(255,0,153,.25); }
    .tech-purple  { color: var(--purple);  background: rgba(189,0,255,.08);  border-color: rgba(189,0,255,.25); }
    .tech-orange  { color: var(--orange);  background: rgba(255,102,0,.08);  border-color: rgba(255,102,0,.25); }
    .tech-green   { color: var(--green);   background: rgba(57,255,20,.08);  border-color: rgba(57,255,20,.25); }

    /* ── Outcome metrics ── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    .metric-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      text-align: center;
    }

    .metric-value {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      color: var(--cyan);
      text-shadow: var(--glow-cyan);
      display: block;
      margin-bottom: 4px;
    }

    .metric-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2);
      letter-spacing: .1em;
    }

    /* ── Project links ── */
    .detail-links {
      display: flex;
      gap: 14px;
      margin-top: 36px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .28s;
      border: 2px solid transparent;
    }

    .link-primary {
      background: var(--cyan); color: var(--bg);
      border-color: var(--cyan); box-shadow: var(--glow-cyan);
    }
    .link-primary:hover { background: transparent; color: var(--cyan); }

    .link-outline {
      background: transparent; color: var(--text);
      border-color: rgba(255,255,255,.2);
    }
    .link-outline:hover { border-color: var(--magenta); color: var(--magenta); box-shadow: var(--glow-magenta); }

    /* ── Not found state ── */
    .not-found {
      text-align: center;
      padding: 100px 0;
    }
    .not-found .big-emoji { font-size: 60px; margin-bottom: 20px; }
    .not-found h2 { font-family: var(--font-display); font-size: 24px; margin-bottom: 12px; color: var(--magenta); }
    .not-found p  { color: var(--text-2); margin-bottom: 24px; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .site-nav   { padding: 14px 20px; }
      .detail-wrap { padding: 100px 20px 60px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <!-- Nav -->
  <nav class="site-nav">
    <a href="../index.html" class="back-btn">← Back</a>
    <span class="nav-brand">Sally / Project</span>
  </nav>

  <!-- Content injected by JS -->
  <main class="detail-wrap" id="detailWrap">
    <div class="not-found" id="loadingState">
      <div class="big-emoji">⚡</div>
      <h2>Loading…</h2>
    </div>
  </main>

  <script>
  /* ── Project data ── */
  const projects = {
    'gathereease': {
      title:    'GatherEase AI',
      accent:   'AI',
      category: 'Business · AI Startup',
      company:  'GatherEase AI',
      period:   '2022 — 2023',
      status:   'Startup',
      emoji:    '🤖',
      overview: 'Co-founded GatherEase — an AI-powered event management platform that automates the labour-intensive parts of event coordination: attendee matching, smart scheduling, venue recommendations, and post-event analytics.',
      challenge: 'Event managers were spending 60-70% of their time on manual coordination tasks. We set out to build an AI layer that could take over those workflows, letting organisers focus on creative and high-value decisions.',
      solution: 'Built a FastAPI backend integrating GPT-4 for natural language event query and summarisation. Developed a smart attendee-matching algorithm using vector embeddings. React frontend with drag-and-drop schedule builder. Launched a beta with 3 paying clients in 4 months.',
      outcome: 'Validated the market fit with real paying customers and measurable time savings for event organisers.',
      metrics: [
        { value: '3',   label: 'Paying clients' },
        { value: '65%', label: 'Time saved' },
        { value: '4mo', label: 'MVP to launch' },
        { value: 'GPT-4', label: 'Core AI model' },
      ],
      tech: [
        { label: 'OpenAI GPT-4', style: 'cyan' },
        { label: 'FastAPI',      style: 'magenta' },
        { label: 'React',        style: 'cyan' },
        { label: 'PostgreSQL',   style: 'purple' },
        { label: 'pgvector',     style: 'purple' },
        { label: 'Python',       style: 'green' },
        { label: 'Docker',       style: 'orange' },
      ],
      links: { live: '#', github: '#' },
    },

    'exam-prep-agent': {
      title:    'Last Min Exam Prep',
      accent:   'Exam Prep',
      category: 'Fun · Hackathon',
      company:  'Side Project',
      period:   '2023',
      status:   'Hackathon Award 🎖️',
      emoji:    '📝',
      overview: 'A web app that turns a student\'s past exams and homework into a prioritized practice exam, so last-minute revision focuses on the topics most likely to matter.',
      challenge: 'Students cramming before an exam don\'t know which topics to prioritize when reviewing a semester\'s worth of past papers and homework.',
      solution: 'Built a React front end and FastAPI backend that ingests uploaded past exams and homework, uses HuggingFace-hosted models (Gemini, OpenAI) to extract and weight recurring topics, then auto-generates a prioritized practice exam.',
      outcome: 'Built during a hackathon and recognized with an award for its practical approach to exam prep.',
      metrics: [
        { value: '🎖️', label: 'Hackathon Award' },
        { value: 'AI-Ranked', label: 'Practice Priority' },
      ],
      tech: [
        { label: 'React',       style: 'cyan' },
        { label: 'FastAPI',     style: 'magenta' },
        { label: 'HuggingFace', style: 'purple' },
        { label: 'Gemini',      style: 'orange' },
        { label: 'OpenAI',      style: 'green' },
      ],
      links: { live: null, github: null },
    },
  };

  /* ── Render ── */
  function render() {
    const params = new URLSearchParams(window.location.search);
    const id     = params.get('id');
    const p      = projects[id];
    const wrap   = document.getElementById('detailWrap');

    if (!p) {
      wrap.innerHTML = `
        <div class="not-found">
          <div class="big-emoji">🐻</div>
          <h2>Project not found</h2>
          <p>This project doesn't exist yet — or maybe it's top secret.</p>
          <a href="../index.html#projects" class="link-btn link-primary">← Back to Projects</a>
        </div>`;
      return;
    }

    document.title = `${p.title} | Sally`;

    const techHtml = p.tech.map(t =>
      `<span class="tech-pill tech-${t.style}">${t.label}</span>`
    ).join('');

    const metricsHtml = p.metrics.map(m => `
      <div class="metric-card">
        <span class="metric-value">${m.value}</span>
        <span class="metric-label">${m.label}</span>
      </div>`
    ).join('');

    const liveLink = p.links.live
      ? `<a href="${p.links.live}" class="link-btn link-primary" target="_blank">↗ View Live</a>` : '';
    const ghLink = p.links.github
      ? `<a href="${p.links.github}" class="link-btn link-outline" target="_blank">⌥ GitHub</a>` : '';

    wrap.innerHTML = `
      <div class="detail-hero">
        <span class="detail-category">${p.category}</span>
        <h1 class="detail-title">
          ${p.emoji} ${p.title.replace(p.accent, `<span class="accent">${p.accent}</span>`)}
        </h1>
        <div class="detail-meta">
          <span class="meta-chip"><span class="dot"></span>${p.company}</span>
          <span class="meta-chip"><span class="dot"></span>${p.period}</span>
          <span class="meta-chip"><span class="dot"></span>${p.status}</span>
        </div>
      </div>

      <div class="detail-section">
        <p class="ds-label">Overview</p>
        <h2 class="ds-heading">What is it?</h2>
        <p class="ds-body">${p.overview}</p>
      </div>

      <div class="detail-section">
        <p class="ds-label">Challenge</p>
        <h2 class="ds-heading">The Problem</h2>
        <p class="ds-body">${p.challenge}</p>
      </div>

      <div class="detail-section">
        <p class="ds-label">Solution</p>
        <h2 class="ds-heading">How We Built It</h2>
        <p class="ds-body">${p.solution}</p>
      </div>

      <div class="detail-section">
        <p class="ds-label">Outcome</p>
        <h2 class="ds-heading">Results</h2>
        <p class="ds-body">${p.outcome}</p>
        <div class="metrics-row">${metricsHtml}</div>
      </div>

      <div class="detail-section">
        <p class="ds-label">Stack</p>
        <h2 class="ds-heading">Technologies Used</h2>
        <div class="tech-grid">${techHtml}</div>
      </div>

      ${(liveLink || ghLink) ? `<div class="detail-links">${liveLink}${ghLink}</div>` : ''}
    `;
  }

  render();

  /* Fade in */
  window.addEventListener('DOMContentLoaded', () => {
    document.body.style.opacity = '1';
  });
  document.body.style.opacity = '1';
  </script>
</body>
</html>
